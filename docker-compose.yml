services:
    laravel.test:
        build:
            context: .
            dockerfile: docker/production.Dockerfile
            target: app
        image: socialoud/apache:8.4
        env_file:
            - .env
        environment:
            APP_DEBUG: 'false'
        ports:
            - '127.0.0.1:8082:80'
        volumes:
            - './storage:/var/www/html/storage'
            - './public/storage:/var/www/html/public/storage'
        networks:
            - shared-mysql
        mem_limit: 512m
        cpus: '0.70'
        healthcheck:
            test: ['CMD-SHELL', 'php -r "exit(fsockopen(\"127.0.0.1\", 80) ? 0 : 1);"']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

networks:
    shared-mysql:
        external: true
        name: monitoring-db-phpmyadmin-w2gvm2
