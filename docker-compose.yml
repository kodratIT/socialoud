services:
    laravel.test:
        build:
            context: .
            dockerfile: docker/production.Dockerfile
            target: app
        image: socialoud/apache:8.4
        env_file:
            - .env
        environment:
            APP_DEBUG: 'false'
        ports:
            - '127.0.0.1:8082:8082'
        command:
            - sh
            - -c
            - >-
              mkdir -p storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs public/storage
              && chown -R www-data:www-data storage public/storage
              && exec apache2-foreground
        volumes:
            - 'socialoud-storage:/var/www/html/storage'
            - 'socialoud-public-storage:/var/www/html/public/storage'
        networks:
            - shared-mysql
        mem_limit: 1g
        cpus: '2.0'
        healthcheck:
            test: ['CMD-SHELL', 'php -r "exit(fsockopen(\"127.0.0.1\", 8082) ? 0 : 1);"']
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 15s

networks:
    shared-mysql:
        external: true
        name: monitoring-db-phpmyadmin-w2gvm2

volumes:
    socialoud-storage:
        name: socialoud-storage
    socialoud-public-storage:
        name: socialoud-public-storage
